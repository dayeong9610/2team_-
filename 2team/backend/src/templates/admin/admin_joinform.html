<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>가입 페이지</title>
</head>
<body>
    <form method="post" action="/admins/signup">
      <label>ID</label> <input type = "text" name = "admin_id" id="admin_id" placeholder="아이디를 입력하시오." required maxlength="20">
      <br>
      <label>비밀번호</label> <input type="password" name = "admin_pw" id = "admin_pw" placeholder="비밀번호를 입력하시오." required maxlength="20">
      <br>
      <label>비밀번호 확인</label> <input type="password" id = "admin_pw_confirm" placeholder="비밀번호를 다시 입력하시오." required maxlength="20">
      <br>
      <label>이름</label> <input type = "text" name = "admin_name" id = "admin_name" placeholder="이름을 입력하시오" required>
      <br>
      <label>교원번호</label> <input type="text" name = "teacher_num" id = "teacher_num" placeholder = "교원번호를 입력하시오" required maxlength="6">
      <br>
      <label>전화번호</label> <input type="text" name = "contact" id="contact" placeholder = "전화번호를 입력하시오" required maxlength = "13">
      <br>
      <button type="submit">
        가입하기
      </button>
    </form>
</body>
</html>
