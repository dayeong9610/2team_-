<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>로그인 페이지</title>
</head>
<body>
    <h1>로그인 페이지입니다.</h1>
    <form method="post" action="/admins/signin">
        <label for="username">아이디</label><input type="text" name="username" id="username" required autocomplete="username">
        <br>
        <label for="password">비밀번호</label><input type="password" name="password" id="password" required autocomplete="current-password">
        <button type="submit">로그인</button>
    </form>
</body>
</html>
