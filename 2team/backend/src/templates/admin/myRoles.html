<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>내가 작성한 시츄에이션</title>
</head>
<body>
    <p>
        {{ admin_id }} 님이 작성하신 시츄에이션의 갯수는 총 {{ total_count }} 건입니다.
    </p>
    {% if not llm_roles %}
        <span>작성한 시츄에이션이 없습니다</span>
    {% else %}
        <table>
            <tr>
                <th>일련번호</th>
                <th>제목</th>
                <th>작성일시</th>
            </tr>
            {% for llm_role in llm_roles %}
                <tr>
                    <td>
                        {{ llm_role.lr_num }}
                    </td>
                    <td>
                        <a href="/admins/llmRole/{{ llm_role.lr_num }}">{{ llm_role.title }}</a>
                    </td>
                    <td>
                        {{ llm_role.created_at }}
                    </td>
                </tr>
            {% endfor %}
        </table>
    {% endif %}
</body>
</html>
