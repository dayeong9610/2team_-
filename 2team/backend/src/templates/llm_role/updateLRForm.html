<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ llm_role.title }} 수정폼</title>
</head>
<body>
    <form method="post" action="/admins/updateLlmRole/{{ llm_role.lr_num }}">
        <label>카테고리</label>
        <select name="category">
            <option value="school" {% if llm_role.category == "school" %}selected{% endif %}>교내</option>
            <option value="trip" {% if llm_role.category == "trip" %}selected{% endif %}>해외여행</option>
            <option value="club" {% if llm_role.category == "club" %}selected{% endif %}>클럽마약</option>
            <option value="user_defined" {% if llm_role.category == "user_defined" %}selected{% endif %}>사용자 정의</option>
        </select>
        <input type="text" name="title" placeholder="제목을 입력하시오" value="{{ llm_role.title }}" maxlength="30" required>
        <br>
        <textarea name="content" placeholder="챗봇에게 제공할 상황을 상세하게 기술해주세요." >
            {{ llm_role.content }}
        </textarea>
        <br>
        <button type="submit">
            수정하기
        </button>
    </form>
</body>
</html>
