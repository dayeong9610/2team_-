<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>LLM Role 작성페이지</title>
</head>
<body>
    <form method="post" action="/admins/write">
        <label>카테고리</label>
        <select name="category">
            <option value="school">교내</option>
            <option value="trip">해외여행</option>
            <option value="club">클럽마약</option>
            <option value="user_defined">사용자 정의</option>
        </select>
        <input type="text" name="title" placeholder="제목을 입력하시오" maxlength="30" required>
        <br>
        <textarea name="content" placeholder="챗봇에게 제공할 상황을 상세하게 기술해주세요.">
        </textarea>
        <br>
        <button type="submit">
            작성하기
        </button>
    </form>
</body>
</html>
